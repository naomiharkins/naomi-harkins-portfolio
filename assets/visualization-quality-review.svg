<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Scientific chart readability review summary</title>
<desc id="desc">Six cards explain the main readability problem found in six astronomy charts: crowded points, low contrast, overlapping data, oversized markers, an unclear legend, and confusing axes.</desc>
<rect width="1200" height="675" fill="#f4f7fb"/>
<text x="70" y="78" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#172033">Scientific Chart Readability Review</text>
<text x="70" y="120" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#526174">Six astronomy charts reviewed for readability and clear communication</text>
<g font-family="Arial, Helvetica, sans-serif">
  <g transform="translate(70 170)">
    <rect width="330" height="155" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="3"/>
    <text x="24" y="42" font-size="22" font-weight="700" fill="#174ea6">Figure 1</text>
    <text x="24" y="82" font-size="29" font-weight="700" fill="#172033">Crowded points</text>
    <text x="24" y="116" font-size="18" fill="#526174"><tspan x="24" dy="0">Many points overlap and</tspan><tspan x="24" dy="24">are hard to separate</tspan></text>
  </g>
  <g transform="translate(435 170)">
    <rect width="330" height="155" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="3"/>
    <text x="24" y="42" font-size="22" font-weight="700" fill="#174ea6">Figure 2</text>
    <text x="24" y="82" font-size="29" font-weight="700" fill="#172033">Low contrast</text>
    <text x="24" y="116" font-size="18" fill="#526174"><tspan x="24" dy="0">Some markers blend into</tspan><tspan x="24" dy="24">the background</tspan></text>
  </g>
  <g transform="translate(800 170)">
    <rect width="330" height="155" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="3"/>
    <text x="24" y="42" font-size="22" font-weight="700" fill="#174ea6">Figure 3</text>
    <text x="24" y="82" font-size="29" font-weight="700" fill="#172033">Overlapping data</text>
    <text x="24" y="116" font-size="18" fill="#526174"><tspan x="24" dy="0">Eleven distributions are</tspan><tspan x="24" dy="24">hard to compare</tspan></text>
  </g>
  <g transform="translate(70 365)">
    <rect width="330" height="155" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="3"/>
    <text x="24" y="42" font-size="22" font-weight="700" fill="#a54100">Figure 4</text>
    <text x="24" y="82" font-size="29" font-weight="700" fill="#172033">Oversized markers</text>
    <text x="24" y="116" font-size="18" fill="#526174"><tspan x="24" dy="0">Large X symbols hide</tspan><tspan x="24" dy="24">the contour map</tspan></text>
  </g>
  <g transform="translate(435 365)">
    <rect width="330" height="155" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="3"/>
    <text x="24" y="42" font-size="22" font-weight="700" fill="#a54100">Figure 5</text>
    <text x="24" y="82" font-size="29" font-weight="700" fill="#172033">Unclear legend</text>
    <text x="24" y="116" font-size="18" fill="#526174"><tspan x="24" dy="0">Line and point groups need</tspan><tspan x="24" dy="24">clearer labels</tspan></text>
  </g>
  <g transform="translate(800 365)">
    <rect width="330" height="155" rx="18" fill="#ffffff" stroke="#d9e0ea" stroke-width="3"/>
    <text x="24" y="42" font-size="22" font-weight="700" fill="#a54100">Figure 6</text>
    <text x="24" y="82" font-size="29" font-weight="700" fill="#172033">Confusing axes</text>
    <text x="24" y="116" font-size="18" fill="#526174"><tspan x="24" dy="0">Axis labels may not match</tspan><tspan x="24" dy="24">the plotted values</tspan></text>
  </g>
  <rect x="70" y="556" width="1060" height="78" rx="14" fill="#eaf1fd" stroke="#c8d7f3" stroke-width="2"/>
  <text x="600" y="589" text-anchor="middle" font-size="20" font-weight="700" fill="#173b72"><tspan x="600" dy="0">What I checked: chart type · labels · contrast · spacing</tspan><tspan x="600" dy="27">readability · amount of information · suggested fixes</tspan></text>
</g>
</svg>